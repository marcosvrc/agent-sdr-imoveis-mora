[project]
name = "sdr-shared"
version = "0.1.0"
description = "Contratos, modelos e acesso a dados compartilhados entre os serviços"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pydantic-settings>=2.3", "psycopg[binary,pool]>=3.2", "pgvector>=0.3", "numpy>=1.26", "httpx>=0.27"]

[project.optional-dependencies]
local = ["redis>=5.0", "langchain-ollama>=0.2", "langchain-anthropic>=0.2"]
# Reserva de LLM (ADR-0009) e bancada de avaliação usam o mesmo pacote.
openai = ["langchain-openai>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
