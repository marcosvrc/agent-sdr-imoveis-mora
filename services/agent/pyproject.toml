[project]
name = "sdr-agent"
version = "0.1.0"
description = "Grafo multiagente do SDR (LangGraph + Bedrock)"
requires-python = ">=3.12"
dependencies = [
  "sdr-shared",
  "langgraph>=0.2",
  "langgraph-checkpoint-postgres>=2.0",
  "langchain-core>=0.3",
]

[project.optional-dependencies]
aws = ["sdr-shared[aws]", "boto3>=1.35"]
# faster-whisper: transcrição de áudio in-process no perfil local (sem AWS). Opcional de propósito —
# o CI usa o extra [dev], que não o instala; os testes de transcrição mockam o motor.
local = ["sdr-shared[local]", "faster-whisper>=1.0"]
dev = ["pytest", "pytest-asyncio", "moto"]

[tool.uv.sources]
sdr-shared = { path = "../../shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
