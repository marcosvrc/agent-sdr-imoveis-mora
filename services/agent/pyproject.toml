[project]
name = "sdr-agent"
version = "0.1.0"
description = "Grafo multiagente do SDR (LangGraph)"
requires-python = ">=3.12"
dependencies = [
  "sdr-shared",
  "langgraph>=0.2",
  "langgraph-checkpoint-postgres>=2.0",
  "langchain-core>=0.3",
]

[project.optional-dependencies]
# faster-whisper: transcrição de áudio in-process, sem serviço externo. Opcional de propósito —
# o CI usa o extra [dev], que não o instala; os testes de transcrição mockam o motor.
# `av<14`: o PyAV 14 tirou o parâmetro `metadata_errors` que o faster-whisper passa ao abrir o áudio,
# e toda mensagem de voz falhava com TypeError ("Não consegui ouvir seu áudio"). Sem o teto, um
# `--build` qualquer trazia a versão nova e quebrava a transcrição em silêncio.
local = ["sdr-shared[local]", "faster-whisper>=1.0", "av>=11,<14"]
dev = ["pytest", "pytest-asyncio"]

[tool.uv.sources]
sdr-shared = { path = "../../shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
