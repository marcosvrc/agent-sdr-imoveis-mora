[project]
name = "sdr-ingestion"
version = "0.1.0"
description = "Carga da base simulada: Aurora (relacional + embeddings) e S3 (Knowledge Base)"
requires-python = ">=3.12"
dependencies = ["sdr-shared", "boto3>=1.35"]
[tool.uv.sources]
sdr-shared = { path = "../../shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdr_ingestion"]
