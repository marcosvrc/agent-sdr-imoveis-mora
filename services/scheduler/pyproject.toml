[project]
name = "sdr-scheduler"
version = "0.1.0"
description = "Follow-up automático com EventBridge Scheduler (one-shot por lead)"
requires-python = ">=3.12"
dependencies = ["sdr-shared"]
[project.optional-dependencies]
aws = ["boto3>=1.35"]
[tool.uv.sources]
sdr-shared = { path = "../../shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdr_scheduler"]
