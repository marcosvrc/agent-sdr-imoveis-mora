<text x="548.0" y="800" class="t-leg">Vetor</text>
<path d="M962.0 800h34" class="aresta s-verde" marker-end="url(#p-verde)"/>
<text x="1008.0" y="800" class="t-leg">Saída para o cliente</text>
<path d="M1422.0 800h34" class="aresta s-cinza" marker-end="url(#p-cinza)"/>
<text x="1468.0" y="800" class="t-leg">Consulta ao índice</text>
