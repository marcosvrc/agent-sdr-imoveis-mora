<path d="M1520.0 526.0 L1520.0 588.0" class="aresta s-verde" marker-end="url(#p-verde)"/>
<rect x="330.0" y="720" width="1300" height="30" rx="7" class="cartao"/>
<text x="980" y="735" class="t-sub-s" text-anchor="middle">Sem embedder no ar (Ollama fora, provedor sem chave) a busca cai para os filtros SQL puros e devolve sem_embedding — pior que a semântica, melhor que derrubar o turno.</text>
<line x1="40" y1="774" x2="1920" y2="774" class="linha"/>
<path d="M42.0 800h34" class="aresta s-azul" marker-end="url(#p-azul)"/>
