<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1960 820" width="1960" height="820" role="img" aria-label="A busca tenta o bairro pedido, depois os vizinhos, a região e a cidade; o nível alcançado vai para o prompt e o agente não afirma indisponibilidade fora dele.">
<style>
  text{font-family:Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;dominant-baseline:middle}
  .t-tit{font-size:17px;font-weight:600;fill:#12293C}
  .t-tit-s{font-size:14.5px;font-weight:600;fill:#12293C}
  .t-sub{font-size:12px;font-weight:400;fill:#5B7387}
  .t-sub-s{font-size:11px;font-weight:400;fill:#5B7387}
  .t-mini{font-size:10.5px;font-weight:400;fill:#8497A8}
  .t-grp{font-size:12px;font-weight:700;fill:#2C5F84;letter-spacing:.07em}
  .t-grp-s{font-size:11px;font-weight:400;fill:#8497A8}
  .t-seta{font-size:11.5px;font-weight:500}
  .t-leg{font-size:11.5px;font-weight:500;fill:#5B7387}
  .t-rod{font-size:10px;font-weight:700;fill:#8497A8;letter-spacing:.09em}
  .t-cab{font-size:27px;font-weight:700;fill:#FFFFFF}
  .t-cab-s{font-size:13.5px;font-weight:400;fill:#9DB3C4}
  .t-cab-r{font-size:13px;font-weight:700;fill:#9DB3C4;letter-spacing:.34em;opacity:.72}
  .cartao{fill:#FFFFFF;stroke:#DCE4EC;stroke-width:1}
  .grupo{fill:#E9F1F8;stroke:#D5E2EE;stroke-width:1}
  .linha{stroke:#DCE4EC;stroke-width:1}
  .s-azul{stroke:#2E76B8} .f-azul{fill:#2E76B8} .x-azul{fill:#2E76B8}
  .s-verde{stroke:#0E7F72} .f-verde{fill:#0E7F72} .x-verde{fill:#0E7F72}
  .s-roxo{stroke:#7A4CC0} .f-roxo{fill:#7A4CC0} .x-roxo{fill:#7A4CC0}
  .s-cinza{stroke:#64798C} .f-cinza{fill:#64798C} .x-cinza{fill:#64798C}
  .s-ambar{stroke:#A9701A} .f-ambar{fill:#A9701A} .x-ambar{fill:#A9701A}
  .s-vermelho{stroke:#B04437} .f-vermelho{fill:#B04437} .x-vermelho{fill:#B04437}
  .s-tinta2{stroke:#5B7387} .f-tinta2{fill:#5B7387} .x-tinta2{fill:#5B7387}
  .aresta{fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs><marker id="p-azul" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 1.2 9 5 0.5 8.8 2.6 5z" class="f-azul"/></marker><marker id="p-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 1.2 9 5 0.5 8.8 2.6 5z" class="f-verde"/></marker><marker id="p-roxo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 1.2 9 5 0.5 8.8 2.6 5z" class="f-roxo"/></marker><marker id="p-cinza" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 1.2 9 5 0.5 8.8 2.6 5z" class="f-cinza"/></marker><marker id="p-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 1.2 9 5 0.5 8.8 2.6 5z" class="f-ambar"/></marker><marker id="p-vermelho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 1.2 9 5 0.5 8.8 2.6 5z" class="f-vermelho"/></marker><marker id="p-tinta2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 1.2 9 5 0.5 8.8 2.6 5z" class="f-tinta2"/></marker></defs>
<rect width="1960" height="820" fill="#F4F7FA"/>
<rect width="1960" height="92" fill="#0E2433"/>
<rect x="40" y="26" width="5" height="40" rx="2.5" fill="#3FC7B4"/>
<text x="60" y="35.0" class="t-cab">Cascata da busca de imóveis</text>
<text x="61" y="61.0" class="t-cab-s">Do bairro pedido até a cidade, dizendo sempre até onde precisou ir</text>
<text x="1920" y="46.0" class="t-cab-r" text-anchor="end">MORA</text>
<rect x="46" y="236" width="250" height="110" rx="11" class="cartao"/>
<rect x="62" y="253" width="34" height="34" rx="9" fill="#E4EFF9"/>
<g transform="translate(68.0,259.0) scale(0.9167)" fill="none" stroke="#2E76B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h11v17h-11zM9.5 8.5h5M9.5 12h5M9.5 15.5h3"/></g>
<text x="106" y="262" class="t-tit">Cartão do lead</text>
<text x="106" y="284" class="t-sub">Intenção, bairros, preço,</text>
<text x="106" y="300" class="t-sub">quartos, urgência</text>
<rect x="46" y="400" width="250" height="96" rx="11" class="cartao"/>
<rect x="62" y="417" width="34" height="34" rx="9" fill="#EDE6F9"/>
<g transform="translate(68.0,423.0) scale(0.9167)" fill="none" stroke="#7A4CC0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 3.5h7v7h-7zM13.5 3.5h7v7h-7zM3.5 13.5h7v7h-7zM13.5 13.5h7v7h-7z"/></g>
<text x="106" y="426" class="t-tit">Um embedding</text>
<text x="106" y="448" class="t-sub">por busca, não por nível</text>
<rect x="380" y="236" width="310" height="110" rx="11" class="cartao"/>
<rect x="396" y="253" width="34" height="34" rx="9" fill="#E4EFF9"/>
<g transform="translate(402.0,259.0) scale(0.9167)" fill="none" stroke="#2E76B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zM12 13.8a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6z"/></g>
<text x="440" y="262" class="t-tit-s">Bairro pedido</text>
<text x="440" y="284" class="t-sub">o que o cliente falou</text>
<text x="535.0" y="206" class="t-mini" text-anchor="middle">nível "bairro"</text>
<path d="M690.0 291.0 L780.0 291.0" class="aresta s-azul" marker-end="url(#p-azul)"/>
<text x="735.0" y="266" class="t-seta x-azul" text-anchor="middle">sem resultado</text>
<path d="M535.0 346.0 L535.0 430.0" class="aresta s-cinza"/>
<rect x="780" y="236" width="310" height="110" rx="11" class="cartao"/>
<rect x="796" y="253" width="34" height="34" rx="9" fill="#E4EFF9"/>
<g transform="translate(802.0,259.0) scale(0.9167)" fill="none" stroke="#2E76B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 18.2a7.2 7.2 0 1 0 0-14.4 7.2 7.2 0 0 0 0 14.4zM16.4 16.4 20.5 20.5"/></g>
<text x="840" y="262" class="t-tit-s">Bairros vizinhos</text>
<text x="840" y="284" class="t-sub">mesma região, mais próximos</text>
<text x="935.0" y="206" class="t-mini" text-anchor="middle">nível "vizinhos"</text>
<path d="M1090.0 291.0 L1180.0 291.0" class="aresta s-azul" marker-end="url(#p-azul)"/>
<text x="1135.0" y="266" class="t-seta x-azul" text-anchor="middle">sem resultado</text>
<path d="M935.0 346.0 L935.0 430.0" class="aresta s-cinza"/>
<rect x="1180" y="236" width="310" height="110" rx="11" class="cartao"/>
<rect x="1196" y="253" width="34" height="34" rx="9" fill="#E4EFF9"/>
<g transform="translate(1202.0,259.0) scale(0.9167)" fill="none" stroke="#2E76B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 18.2a7.2 7.2 0 1 0 0-14.4 7.2 7.2 0 0 0 0 14.4zM16.4 16.4 20.5 20.5"/></g>
<text x="1240" y="262" class="t-tit-s">Região</text>
<text x="1240" y="284" class="t-sub">zona sul, oeste…</text>
<text x="1335.0" y="206" class="t-mini" text-anchor="middle">nível "regiao"</text>
<path d="M1490.0 291.0 L1580.0 291.0" class="aresta s-azul" marker-end="url(#p-azul)"/>
<text x="1535.0" y="266" class="t-seta x-azul" text-anchor="middle">sem resultado</text>
<path d="M1335.0 346.0 L1335.0 430.0" class="aresta s-cinza"/>
<rect x="1580" y="236" width="310" height="110" rx="11" class="cartao"/>
<rect x="1596" y="253" width="34" height="34" rx="9" fill="#E4EFF9"/>
<g transform="translate(1602.0,259.0) scale(0.9167)" fill="none" stroke="#2E76B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 20.5V5.2l8-2.7v18M12.5 20.5h7V9.5h-7M7.5 8.5h2M7.5 12h2M7.5 15.5h2M15 12.5h1.5M15 16h1.5M2.5 20.5h19"/></g>
<text x="1640" y="262" class="t-tit-s">Cidade</text>
<text x="1640" y="284" class="t-sub">melhor algo bom fora da área</text>
<text x="1640" y="300" class="t-sub">que dizer que não há nada</text>
<text x="1735.0" y="206" class="t-mini" text-anchor="middle">nível "cidade"</text>
<path d="M1735.0 346.0 L1735.0 430.0" class="aresta s-cinza"/>
<rect x="380" y="430" width="1510" height="96" rx="11" class="cartao"/>
<rect x="396" y="447" width="34" height="34" rx="9" fill="#E8EDF2"/>
<g transform="translate(402.0,453.0) scale(0.9167)" fill="none" stroke="#64798C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c4.4 0 8 1.2 8 2.7S16.4 9 12 9 4 7.7 4 6.2 7.6 3.5 12 3.5zM4 6.2v11.6c0 1.5 3.6 2.7 8 2.7s8-1.2 8-2.7V6.2M4 12c0 1.5 3.6 2.7 8 2.7s8-1.2 8-2.7"/></g>
<text x="440" y="456" class="t-tit-s">Filtros SQL + similaridade de cosseno, na mesma consulta</text>
<text x="440" y="478" class="t-sub">operação · região · bairros · preço (+15 %) · quartos mínimos — ImovelRepository.buscar_hibrido</text>
<rect x="380" y="588" width="740" height="110" rx="11" class="cartao"/>
<rect x="396" y="605" width="34" height="34" rx="9" fill="#DDF0EC"/>
<g transform="translate(402.0,611.0) scale(0.9167)" fill="none" stroke="#0E7F72" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM8.2 12.2l2.6 2.6 5-5.2"/></g>
<text x="440" y="614" class="t-tit-s">Imóveis recomendados</text>
<text x="440" y="636" class="t-sub">Até 3 por turno, sem repetir o que já foi visto</text>
<text x="440" y="652" class="t-sub">ou descartado (tabela interesses)</text>
<rect x="1150" y="588" width="740" height="110" rx="11" class="cartao"/>
<rect x="1166" y="605" width="34" height="34" rx="9" fill="#DDF0EC"/>
<g transform="translate(1172.0,611.0) scale(0.9167)" fill="none" stroke="#0E7F72" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 11V5.2a1.7 1.7 0 0 1 3.4 0V11M11.9 11V4.2a1.7 1.7 0 0 1 3.4 0V11M15.3 11V6.2a1.7 1.7 0 0 1 3.4 0v8.3c0 3.7-2.6 6.5-6.4 6.5-3.1 0-4.6-1.3-6.2-3.6l-2-3a1.7 1.7 0 0 1 2.7-2l1.3 1.6"/></g>
<text x="1210" y="614" class="t-tit-s">Alternativa no bairro pedido</text>
<text x="1210" y="636" class="t-sub">Relaxa quartos e depois preço: “de 2 quartos não</text>
<text x="1210" y="652" class="t-sub">tenho aí, mas tenho este de 1”</text>
<path d="M296.0 291.0 L380.0 291.0" class="aresta s-azul" marker-end="url(#p-azul)"/>
<path d="M296.0 448.0 L330.0 448.0 Q340.0 448.0 340.0 458.0 L340.0 468.0 Q340.0 478.0 350.0 478.0 L380.0 478.0" class="aresta s-roxo" marker-end="url(#p-roxo)"/>
