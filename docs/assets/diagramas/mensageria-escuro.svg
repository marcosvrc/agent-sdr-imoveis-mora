<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1960 1010" width="1960" height="1010" role="img" aria-label="Tabela visual dos tópicos do Redis Streams, com quem publica e quem consome cada um." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  text{font-family:Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;dominant-baseline:middle}
  .t-tit{font-size:17px;font-weight:600;fill:#E6EEF4}
  .t-tit-s{font-size:14.5px;font-weight:600;fill:#E6EEF4}
  .t-sub{font-size:12px;font-weight:400;fill:#A2B5C3}
  .t-sub-s{font-size:11px;font-weight:400;fill:#A2B5C3}
  .t-mini{font-size:10.5px;font-weight:400;fill:#7A8D9C}
  .t-grp{font-size:12px;font-weight:700;fill:#8FB8D6;letter-spacing:.07em}
  .t-grp-s{font-size:11px;font-weight:400;fill:#7A8D9C}
  .t-seta{font-size:11.5px;font-weight:500}
  .t-leg{font-size:11.5px;font-weight:500;fill:#A2B5C3}
  .t-rod{font-size:10px;font-weight:700;fill:#7A8D9C;letter-spacing:.09em}
  .t-cab{font-size:27px;font-weight:700;fill:#EAF2F7}
  .t-cab-s{font-size:13.5px;font-weight:400;fill:#7E97A8}
  .t-cab-r{font-size:10.5px;font-weight:700;fill:#7E97A8;letter-spacing:.09em}
  .cartao{fill:#16222B;stroke:#2A3843;stroke-width:1}
  .grupo{fill:#121E27;stroke:#223039;stroke-width:1}
  .linha{stroke:#243139;stroke-width:1}
  .s-azul{stroke:#5FA8E4} .f-azul{fill:#5FA8E4} .x-azul{fill:#5FA8E4}
  .s-verde{stroke:#41BFA9} .f-verde{fill:#41BFA9} .x-verde{fill:#41BFA9}
  .s-roxo{stroke:#A88BE6} .f-roxo{fill:#A88BE6} .x-roxo{fill:#A88BE6}
  .s-cinza{stroke:#93A7B8} .f-cinza{fill:#93A7B8} .x-cinza{fill:#93A7B8}
  .s-ambar{stroke:#DCA94F} .f-ambar{fill:#DCA94F} .x-ambar{fill:#DCA94F}
  .s-vermelho{stroke:#E0796A} .f-vermelho{fill:#E0796A} .x-vermelho{fill:#E0796A}
  .s-tinta2{stroke:#A2B5C3} .f-tinta2{fill:#A2B5C3} .x-tinta2{fill:#A2B5C3}
  .aresta{fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs><marker id="p-azul" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 1.2 9 5 0.5 8.8 2.6 5z" class="f-azul"/></marker><marker id="p-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 1.2 9 5 0.5 8.8 2.6 5z" class="f-verde"/></marker><marker id="p-roxo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 1.2 9 5 0.5 8.8 2.6 5z" class="f-roxo"/></marker><marker id="p-cinza" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 1.2 9 5 0.5 8.8 2.6 5z" class="f-cinza"/></marker><marker id="p-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 1.2 9 5 0.5 8.8 2.6 5z" class="f-ambar"/></marker><marker id="p-vermelho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 1.2 9 5 0.5 8.8 2.6 5z" class="f-vermelho"/></marker><marker id="p-tinta2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 1.2 9 5 0.5 8.8 2.6 5z" class="f-tinta2"/></marker></defs>
<rect width="1960" height="1010" fill="#0C151C"/>
<rect width="1960" height="92" fill="#060F16"/>
<rect x="40" y="26" width="5" height="40" rx="2.5" fill="#3FC7B4"/>
<text x="60" y="35.0" class="t-cab">Mensageria</text>
<text x="61" y="61.0" class="t-cab-s">Um tópico por rota, com produtor e consumidor declarados</text>
<text x="1920" y="46.0" class="t-cab-r" text-anchor="end">MORA · COMITÊ DE ARQUITETURA</text>
<rect x="50" y="196" width="520" height="74" rx="11" class="cartao"/>
<text x="68" y="220" class="t-tit-s">channels :8001 · telegram-in</text>
<text x="68" y="242" class="t-sub">o quadro que o cliente mandou</text>
<rect x="700" y="205" width="440" height="56" rx="9" class="cartao"/>
<rect x="700" y="205" width="4" height="56" rx="2" class="f-azul"/>
<text x="920.0" y="233.0" class="t-tit-s" text-anchor="middle">sdr:inbound</text>
<rect x="1280" y="196" width="630" height="74" rx="11" class="cartao"/>
<text x="1298" y="220" class="t-tit-s">agent (grafo)</text>
<text x="1298" y="242" class="t-sub">um turno por vez, com lock por lead</text>
<path d="M570.0 233.0 L700.0 233.0" class="aresta s-azul" marker-end="url(#p-azul)"/>
<path d="M1140.0 233.0 L1280.0 233.0" class="aresta s-azul" marker-end="url(#p-azul)"/>
<rect x="50" y="312" width="520" height="74" rx="11" class="cartao"/>
<text x="68" y="336" class="t-tit-s">agent</text>
<text x="68" y="358" class="t-sub">resposta pronta para o site</text>
<rect x="700" y="321" width="440" height="56" rx="9" class="cartao"/>
<rect x="700" y="321" width="4" height="56" rx="2" class="f-verde"/>
<text x="920.0" y="349.0" class="t-tit-s" text-anchor="middle">sdr:outbound-web</text>
<rect x="1280" y="312" width="630" height="74" rx="11" class="cartao"/>
<text x="1298" y="336" class="t-tit-s">channels :8001</text>
<text x="1298" y="358" class="t-sub">empurra no WebSocket aberto</text>
<path d="M570.0 349.0 L700.0 349.0" class="aresta s-verde" marker-end="url(#p-verde)"/>
<path d="M1140.0 349.0 L1280.0 349.0" class="aresta s-verde" marker-end="url(#p-verde)"/>
<rect x="50" y="428" width="520" height="74" rx="11" class="cartao"/>
<text x="68" y="452" class="t-tit-s">agent</text>
<text x="68" y="474" class="t-sub">resposta pronta para o Telegram</text>
<rect x="700" y="437" width="440" height="56" rx="9" class="cartao"/>
<rect x="700" y="437" width="4" height="56" rx="2" class="f-verde"/>
<text x="920.0" y="465.0" class="t-tit-s" text-anchor="middle">sdr:outbound-telegram</text>
<rect x="1280" y="428" width="630" height="74" rx="11" class="cartao"/>
<text x="1298" y="452" class="t-tit-s">telegram-out</text>
<text x="1298" y="474" class="t-sub">envia pela Bot API</text>
<path d="M570.0 465.0 L700.0 465.0" class="aresta s-verde" marker-end="url(#p-verde)"/>
<path d="M1140.0 465.0 L1280.0 465.0" class="aresta s-verde" marker-end="url(#p-verde)"/>
<rect x="50" y="544" width="520" height="74" rx="11" class="cartao"/>
<text x="68" y="568" class="t-tit-s">agent</text>
<text x="68" y="590" class="t-sub">lead virou qualificado, agendado ou handoff</text>
<rect x="700" y="553" width="440" height="56" rx="9" class="cartao"/>
<rect x="700" y="553" width="4" height="56" rx="2" class="f-roxo"/>
<text x="920.0" y="581.0" class="t-tit-s" text-anchor="middle">sdr:resumir</text>
<rect x="1280" y="544" width="630" height="74" rx="11" class="cartao"/>
<text x="1298" y="568" class="t-tit-s">resumidor</text>
<text x="1298" y="590" class="t-sub">briefing e análise para o corretor</text>
<path d="M570.0 581.0 L700.0 581.0" class="aresta s-roxo" marker-end="url(#p-roxo)"/>
<path d="M1140.0 581.0 L1280.0 581.0" class="aresta s-roxo" marker-end="url(#p-roxo)"/>
<rect x="50" y="660" width="520" height="74" rx="11" class="cartao"/>
<text x="68" y="684" class="t-tit-s">ingestão do acervo</text>
<text x="68" y="706" class="t-sub">entrou imóvel que combina</text>
<rect x="700" y="669" width="440" height="56" rx="9" class="cartao"/>
<rect x="700" y="669" width="4" height="56" rx="2" class="f-roxo"/>
<text x="920.0" y="697.0" class="t-tit-s" text-anchor="middle">sdr:imovel-novo</text>
<rect x="1280" y="660" width="630" height="74" rx="11" class="cartao"/>
<text x="1298" y="684" class="t-tit-s">reativador</text>
<text x="1298" y="706" class="t-sub">avisa quem estava adormecido</text>
<path d="M570.0 697.0 L700.0 697.0" class="aresta s-roxo" marker-end="url(#p-roxo)"/>
<path d="M1140.0 697.0 L1280.0 697.0" class="aresta s-roxo" marker-end="url(#p-roxo)"/>
<rect x="50" y="776" width="520" height="74" rx="11" class="cartao"/>
<text x="68" y="800" class="t-tit-s">agent</text>
<text x="68" y="822" class="t-sub">mudou o estágio do lead</text>
<rect x="700" y="785" width="440" height="56" rx="9" class="cartao"/>
<rect x="700" y="785" width="4" height="56" rx="2" class="f-cinza"/>
<text x="920.0" y="813.0" class="t-tit-s" text-anchor="middle">sdr:events</text>
<rect x="1280" y="776" width="630" height="74" rx="11" class="cartao"/>
<text x="1298" y="800" class="t-tit-s">— sem consumidor hoje</text>
<text x="1298" y="822" class="t-sub">gancho para webhook ou analytics</text>
<path d="M570.0 813.0 L700.0 813.0" class="aresta s-cinza" marker-end="url(#p-cinza)"/>
<path d="M1140.0 813.0 L1280.0 813.0" class="aresta s-cinza" marker-end="url(#p-cinza)"/>
<text x="50" y="170" class="t-grp">QUEM PUBLICA</text>
<text x="920" y="170" class="t-grp" text-anchor="middle">TÓPICO</text>
<text x="1910" y="170" class="t-grp" text-anchor="end">QUEM CONSOME</text>
<rect x="130.0" y="890" width="1700" height="62" rx="7" class="cartao"/>
<text x="980" y="905" class="t-sub-s" text-anchor="middle">O scheduler também publica em sdr:inbound: o follow-up vencido entra como um quadro comum, pelo mesmo caminho do cliente.</text>
<text x="980" y="921" class="t-sub-s" text-anchor="middle">Cada tópico tem um consumer group; no boot o worker retoma o que ficou pendente na PEL (id 0 e XAUTOCLAIM) — a mensagem</text>
<text x="980" y="937" class="t-sub-s" text-anchor="middle">entregue no instante de uma queda não fica sem resposta. O lock por lead vale pelo pior caso de um turno, não por um número fixo.</text>
<text x="40" y="990" class="t-rod">MORA · MENSAGERIA</text>
</svg>