name: ci
on: [push, pull_request]
# O GITHUB_TOKEN do workflow só lê. Nenhum passo daqui escreve no repositório, e um passo
# comprometido (uma action ou um pacote do npm, por exemplo) não ganha permissão de push de graça.
permissions:
  contents: read
# Um push novo no mesmo ramo cancela a execução anterior: o resultado que importa é o do último
# commit, e duas rodadas da suíte com Postgres em paralelo só gastam minuto de runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: sdr, POSTGRES_PASSWORD: sdr, POSTGRES_DB: sdr }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sdr" --health-interval 5s --health-retries 10
    env:
      # As suítes APAGAM tabelas: a trava em guarda_teste.py exige um banco com "test" no nome.
      # PREPARO_DB=psql porque aqui o Postgres é service container do runner, não docker compose.
      TEST_DSN: postgresql://sdr:sdr@localhost:5432/sdr_test
      # O CRM tem banco próprio, aqui também: a separação de D-01 vale na suíte.
      CRM_TEST_DSN: postgresql://sdr:sdr@localhost:5432/crm_test
      CRM_APP_ENV: test
      PREPARO_DB: psql
      SDR_PROFILE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        # Cache do pip chaveado pelos pyproject: muda uma dependência, muda a chave.
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "**/pyproject.toml" }
      # `openai` entra como na imagem (local/dependencias.py): o factory monta ChatOpenAI para os
      # provedores openai e openrouter, e test_factory exercita os dois.
      - run: pip install -e "shared[local,openai]" -e "services/agent[dev]" -e services/api -e "services/crm[mcp,dev]" -e services/scheduler -e services/ingestion pytest fastapi httpx websockets uvicorn ruff coverage pyright
      # Estático antes do teste: erro de nome ou import quebrado aparece em segundos, sem esperar
      # o banco subir e as sete suítes rodarem.
      - name: Análise estática (ruff)
        run: make lint
      # Tipos em modo básico. Foi o que achou `LeadRepository().salvar`, um método que não existe,
      # no caminho de reconhecimento pelo CRM — o ruff não vê isso, e o teste não passava por ali.
      - name: Tipos (pyright básico)
        run: make tipos
      # `make cobertura` roda as MESMAS suítes que `make test` (mesmo alvo test-db, mesmo pytest),
      # medindo cobertura e falhando abaixo do piso de .coveragerc. Rodar os dois seria pagar duas
      # vezes pelo mesmo trabalho.
      - name: Testes com cobertura
        run: make cobertura
      - name: Guardar o relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: cobertura, path: coverage.xml, if-no-files-found: warn }
      # O harness de avaliação com dublês: LLM falso e embedder de trigramas. NÃO mede qualidade —
      # mede que o harness funciona. Sem isto, o eval apodrece calado: um dataset que deixa de
      # carregar, uma métrica que divide por zero ou um nó novo que escapa do dublê e vai chamar o
      # modelo de verdade só apareceriam quando alguém rodasse à mão, meses depois. A qualidade
      # continua sendo `make eval` e `make eval-rag`, locais, com modelo real.
      - name: Harness de avaliação (dublês)
        run: make eval-fake
      # A especificação versionada alimenta o Swagger do portal; se ela envelhecer,
      # a documentação publicada passa a mentir sobre a API.
      - run: python scripts/gerar_openapi.py --verificar
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, dashboard, crm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: cd apps/${{ matrix.app }} && npm ci && npm run build
      # Fora do package.json de propósito (ver eslint.config.js): o container `web` do compose roda
      # `npm install` a cada subida da demo e não deve carregar ferramenta de CI junto.
      - name: Lint do front (eslint)
        run: |
          cd apps/${{ matrix.app }}
          npm i --no-save --legacy-peer-deps eslint@9 typescript-eslint@8 @eslint/js eslint-plugin-react-hooks@5 globals
          npm run lint
  seguranca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "**/pyproject.toml" }
      # O mesmo script do `make segredos`. Aqui não existe local/.env, então a parte dos valores
      # reais é pulada com aviso; ficam os arquivos de credencial versionados e os padrões de chave
      # na árvore deste commit (`--desde HEAD` faz o intervalo vazio cair no próprio HEAD).
      - name: Varredura de segredos
        run: python scripts/checar_segredos.py --desde HEAD
      # Auditoria sobre o que a IMAGEM instala, e não sobre o ambiente do runner: a lista sai de
      # local/dependencias.py, a mesma que o Dockerfile usa, num venv limpo. Assim o relatório fala
      # do whisper e do langgraph que rodam nos containers, e não do setuptools do Ubuntu.
      - name: Dependências Python (pip-audit)
        run: |
          python -m venv /tmp/auditoria
          # O pip que o venv traz é o empacotado com o Python do runner, quase sempre atrasado, e o
          # pip-audit audita o venv inteiro — inclusive ele. Não é dependência do projeto: atualizar.
          /tmp/auditoria/bin/pip install -q --upgrade pip
          python local/dependencias.py . > /tmp/requisitos.txt
          /tmp/auditoria/bin/pip install -q -r /tmp/requisitos.txt pip-audit
          /tmp/auditoria/bin/pip-audit --skip-editable
      # Só dependência de execução (`--omit=dev`) e só a partir de `high`: o que vai para o
      # navegador do cliente. Os avisos moderados do toolchain de build do Vite apareceriam em todo
      # push e ensinariam a ignorar o passo. Os três apps rodam mesmo que o primeiro falhe.
      - name: Dependências do front (npm audit)
        run: |
          falhou=0
          for app in web dashboard crm; do
            echo "── apps/$app"
            (cd apps/$app && npm audit --omit=dev --audit-level=high) || falhou=1
          done
          exit $falhou
